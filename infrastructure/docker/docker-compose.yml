services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.19
    container_name: neo4j
    ports:
      - "8080:7474"   # HTTP UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  huggingface-embeddings-data:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    container_name: huggingface-embeddings-data
    ports:
      - "9000:80"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - DEVICE=cpu
      - MODEL_ID=${EMBEDDING_MODEL_DATA:-sentence-transformers/msmarco-MiniLM-L6-v3}
    volumes:
      - huggingface_data:/data
    restart: unless-stopped

  opensearch:
    image: opensearch-with-mcp:latest
    build:
      context: ./opensearch-mcp
      dockerfile: Dockerfile
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=openSearch$2025
      - OPENSEARCH_JAVA_OPTS=-Xms512M -Xmx512M
      - plugins.ml_commons.mcp_server_enabled=true
      - plugins.ml_commons.mcp_connector_enabled=true
      - plugins.ml_commons.trusted_connector_endpoints_regex=["^https?://localhost.*"]
      - plugins.ml_commons.stream_enabled=true
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - 9200:9200 # REST API
      #- 9600:9600 # Performance Analyzer

  linux-exec-mcp:
    image: linux-exec-mcp:latest
    build:
      context: ../..
      dockerfile: infrastructure/docker/linux-exec-mcp/Dockerfile
    container_name: linux-exec-mcp
    ports:
      - "8002:8002"
    volumes:
      # Mount the work directory from the repo (insurance docs)
      - ../../data:/work:ro
      # Mount the user's Knowledgexpert config directory into the mcp user's home
      - ${HOME}/.knowledgexpert:/home/mcp/.knowledgexpert:rw
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  knowledgexpert-base:
    profiles: ["build"]
    image: knowledgexpert-base:latest
    build:
      context: ../..
      dockerfile: infrastructure/docker/knowledgexpert-base/Dockerfile

volumes:
  ollama_data:
    driver: local
    name: ollama_data
  chroma_data:
    driver: local
    name: chroma_data
  neo4j_data:
    driver: local
    name: neo4j_data
  huggingface_data:
    driver: local
    name: huggingface_data
  opensearch-data:
    driver: local
    name: opensearch-data
