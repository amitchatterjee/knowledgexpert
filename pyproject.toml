[project]
name = "knowledgexpert"
version = "0.0.1"
description = "KnowledgeXpert agent"
authors = [
    { name = "Amit Chatterjee", email = "private@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "psycopg[binary]>=3.2.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "python-dotenv>=1.0.1",
    "langgraph-cli[inmem]>=0.4.14",
    "deepagents>=0.6.12",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-anthropic>=1.4.8",
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
    "copilotkit>=0.1.94",
    "uvicorn>=0.51.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "auth0-server-python>=1.0.0b1,<2",
    "pyjwt>=2.8.0",
    "psycopg-pool>=3.2.0",
    "boto3>=1.34.0",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1", "s3cmd"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["knowledgexpert"]
[tool.setuptools.package-dir]
"knowledgexpert" = "src/knowledgexpert"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "boto3-stubs[s3]>=1.43.78",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]
